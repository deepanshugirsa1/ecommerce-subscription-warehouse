name: ecommerce_subscription_warehouse
version: 1.0.0
config-version: 2
profile: ecommerce_wh

model-paths: ["models"]
test-paths: ["tests"]

models:
  ecommerce_subscription_warehouse:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

vars:
  # How far back an incremental run reaches. Both windows exist because
  # upstream data is restated: subscription events can be backdated, and a
  # payment processor can revise a settled charge for a few days.
  scd2_lookback_days: 7
  txn_restatement_window_days: 5
